name: CareBridge CI - Phase 1

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Audit Chain Verification
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Synthetic Seed Script
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: carebridge
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: backend
        run: |
          python -m app.seed

      - name: Run Backend Pytest Suite
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: carebridge_test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: backend:.
        run: |
          pytest -v tests

  frontend-build:
    name: Frontend Build & PWA Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Build React PWA
        working-directory: ./frontend
        run: |
          npm run build
