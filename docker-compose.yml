services:
  mongo:
    image: mongo:7.0
    container_name: carebridge_mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-init:
    image: mongo:7.0
    container_name: carebridge_mongo_init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      bash -c "
      until mongosh --host mongo:27017 --eval 'db.adminCommand(\"ping\")' > /dev/null 2>&1; do
        sleep 1;
      done;
      mongosh --host mongo:27017 --eval '
        try {
          rs.status();
          print(\"Replica set rs0 already initialized.\");
        } catch (e) {
          rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"mongo:27017\" }]
          });
          print(\"Replica set rs0 initiated.\");
        }
      '
      "

  redis:
    image: redis:7-alpine
    container_name: carebridge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  turn:
    image: coturn/coturn:latest
    container_name: carebridge_turn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--realm=carebridge.local"
      - "--listening-port=3478"
      - "--user=carebridge:turnsecret123"
      - "--lt-cred-mech"
    healthcheck:
      test: ["CMD", "turnutils_uclient", "-p", "3478", "-u", "carebridge", "-w", "turnsecret123", "-e", "127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carebridge_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - MONGO_URI=mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      - MONGO_DB_NAME=carebridge
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=carebridge-super-secret-key-change-in-production-min32chars
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - STUN_SERVER_URL=stun:stun.l.google.com:19302
      - TURN_SERVER_URL=turn:turn:3478
      - TURN_USERNAME=carebridge
      - TURN_PASSWORD=turnsecret123
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: carebridge_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
